[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxreel"
version = "0.1.0"
description = "Consent-first pipeline for AI voice cloning and AI-generated video workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Amini" }]
dependencies = []

[project.scripts]
voxreel = "voxreel.cli:main"

[tool.setuptools.packages.find]
include = ["voxreel*"]
